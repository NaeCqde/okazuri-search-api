name: ci

# Every job runs on every push and pull request: the tests on Windows, macOS and Linux, the build and the archive for every
# platform (the arm ones and the static musl build too), and the release. A version tag (`git tag v0.1.0 && git push --tags`),
# or a run started by hand from the Actions tab with a tag name, makes the release of that tag. Any other push updates the
# pre-release `latest` (its tag moves to the pushed commit). A pull request does not publish anything.
on:
    push:
        paths-ignore:
            - "**.md"
            - "LICENSE*"
            - "docs/**"
            - ".gitignore"
            - ".gitattributes"
            - ".prettierrc*"
            - ".editorconfig"
            - ".vscode/**"
            - ".github/dependabot.yml"
            - ".github/workflows/security.yml"
            - "**/.DS_Store"
        branches: ["**"]
        tags:
            - "v*"
    pull_request:
        paths-ignore:
            - "**.md"
            - "LICENSE*"
            - "docs/**"
            - ".gitignore"
            - ".gitattributes"
            - ".prettierrc*"
            - ".editorconfig"
            - ".vscode/**"
            - ".github/dependabot.yml"
            - ".github/workflows/security.yml"
            - "**/.DS_Store"
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag of the release to create (made from the selected branch if it does not exist)"
                required: true

permissions:
    contents: read

# A newer run on the same branch or tag cancels the one that is still going: no minutes are spent on a commit that was
# replaced already.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

env:
    RUST_BACKTRACE: 1
    # build.rs would otherwise start a process that waits to copy the executable to the project root
    OKAZURI_SEARCH_API_NO_COPY: 1

jobs:
    test:
        name: Test - ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [windows-latest, macos-latest, ubuntu-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            - name: Test
              run: cargo test --locked
            - name: Build
              run: cargo build --locked --release

    # One build and archive per platform, after the tests passed.
    package:
        name: Build - ${{ matrix.platform.os-name }}
        needs: test
        strategy:
            fail-fast: false
            matrix:
                # https://github.com/actions/runner-images
                # `target` is set for a build that is not for the machine it runs on (musl: a static executable
                # with no glibc, for any Linux x86_64 server). Empty means the runner's own target.
                platform:
                    - os-name: Linux-x86_64-musl
                      runs-on: ubuntu-24.04
                      executable: okazuri-search-api
                      target: x86_64-unknown-linux-musl
                    - os-name: Linux-aarch64-musl
                      runs-on: ubuntu-24.04-arm
                      executable: okazuri-search-api
                      target: aarch64-unknown-linux-musl
                    - os-name: Windows-x86_64
                      runs-on: windows-2025
                      executable: okazuri-search-api.exe
                      target: ""
                    - os-name: macOS-aarch64
                      runs-on: macos-latest
                      executable: okazuri-search-api
                      target: ""
        runs-on: ${{ matrix.platform.runs-on }}
        env:
            # where cargo puts the executable: target/release, or target/<target>/release with --target
            BUILD_DIR: target/${{ matrix.platform.target && format('{0}/', matrix.platform.target) }}release
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.platform.target }}
            - uses: Swatinem/rust-cache@v2
              with:
                  key: ${{ matrix.platform.os-name }}
            # The dictionary is downloaded by a build script that runs on the runner itself. The only C code in the
            # program is the crypto of rustls (ring, for the HTTPS requests of the cron jobs), and `musl-gcc` from this
            # package compiles it for the musl target.
            - name: Install musl tools
              if: contains(matrix.platform.target, 'linux-musl')
              run: sudo apt-get update && sudo apt-get install -y musl-tools
            - name: Build
              run: cargo build --locked --release ${{ matrix.platform.target && format('--target {0}', matrix.platform.target) }}

            # Run the executable that was built: the dictionary is inside it, so this tells that the build works.
            # The text goes in through the standard input, which is UTF-8 on every platform.
            - name: Smoke test
              shell: bash
              run: |
                  result=$(printf 'チートアイテム管理局のお仕事\n' | "$BUILD_DIR/${{ matrix.platform.executable }}" convert)
                  echo "$result"
                  [ "$result" = "cheat item kanri kyoku no oshigoto" ]

            # One file per program and platform, uploaded as it is (no archive): <program>-<platform>[.exe], and its SHA-256 next to it.
            # The license, the changes and the config templates are added once, by the release job.
            - name: Package
              shell: bash
              run: |
                  mkdir out
                  asset="okazuri-search-api-${{ matrix.platform.os-name }}"
                  exe="$BUILD_DIR/${{ matrix.platform.executable }}"
                  case "$exe" in *.exe) asset="$asset.exe" ;; esac
                  cp "$exe" "out/$asset"
                  (cd out && { sha256sum "$asset" 2>/dev/null || shasum -a 256 "$asset"; } > "$asset.sha256")
            - uses: actions/upload-artifact@v4
              with:
                  name: okazuri-search-api-${{ matrix.platform.os-name }}
                  path: out/*
                  if-no-files-found: error

    # After every platform has built (so that no two jobs race to create the same release).
    release:
        name: Release
        needs: package
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
            - uses: actions/download-artifact@v4
              with:
                  path: dist
                  merge-multiple: true
            - name: List the files
              run: ls -l dist
            # For a push that is not a version tag: the tag `latest` moves to this commit (created if it is not there).
            # It does not start this workflow again: only `v*` tags do.
            - name: Move the latest tag
              if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/latest" -f sha="${{ github.sha }}" -F force=true \
                    || gh api -X POST "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/latest" -f sha="${{ github.sha }}"
            # The rolling release is made again by every push (the tag was moved just above): its date is the date of the push, and only the
            # files of this run are in it.
            - name: Remove the old rolling release
              if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release delete latest --repo "${{ github.repository }}" --yes || true
            # Next to the executables, once: the license, the changes and the config templates (a file name that starts with a dot cannot be a
            # release asset, so .env is example.env).
            - name: Add the license, the changes and the config templates
              run: |
                  cp "LICENSE" "dist/LICENSE"
                  cp "Changes.md" "dist/Changes.md"
                  cp "config.example.toml" "dist/config.example.toml"
            - name: Make the release
              if: github.event_name != 'pull_request'
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'latest' }}
                  target_commitish: ${{ github.sha }}
                  prerelease: false
                  # the rolling `latest` is shown as the latest release; a version tag keeps GitHub's own rule (by date)
                  make_latest: ${{ (inputs.tag || startsWith(github.ref, 'refs/tags/v')) && 'legacy' || 'true' }}
                  files: dist/*
                  generate_release_notes: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/v') }}
                  fail_on_unmatched_files: true
