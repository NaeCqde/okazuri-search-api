[package]
license = "MIT"
name = "okazuri_search_api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "okazuri-search-api"
path = "src/main.rs"

[dependencies]
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# The server. Only HTTP/1 and query strings are used, so the rest of axum is left out.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "signal", "sync", "time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }

# The HTTP client of the sites, Google Translate, D1 and the `[cron]` jobs: async, with rustls, so no OpenSSL is needed, also for musl.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli"] }

# The search engine (`[search]`): the two SQLite files (a copy of the D1 tables and the cache of the results), through
# SeaORM (sqlx; the SQLite library is compiled into the executable), the patterns of the result links, and JSON for the
# API and for Cloudflare's.
sea-orm = { version = "1", default-features = false, features = ["macros", "runtime-tokio", "sqlx-sqlite"] }
regex = "1"
sha2 = "0.10"
serde_json = "1"
url = "2"

# The text is NFKC-normalized before it is split into words (`romanizer.rs`), like cutlet does.
unicode-normalization = "0.1"

# The morphological analyzer and its dictionary. `embed-unidic` downloads UniDic while building and
# links it into the executable, so there is nothing to install next to the binary (it makes the
# executable large). The TLS used to download it is rustls, so no OpenSSL is needed, also for musl.
lindera = { version = "6", default-features = false, features = ["embed-unidic"] }
brotli = { version = "9.1.3", default-features = false, features = ["std"] }
# The text index of the titles (`textindex.rs`): the pieces of the keys by trigrams, the words, the starts of the words, and the author, scored.
tantivy = { version = "0.22", default-features = false, features = ["mmap", "lz4-compression"] }
# `[search] pin_db`: the database file is mapped and locked in memory (`pin.rs`).
memmap2 = "0.9"
# The public dataset (`dataset`) is gzip: the format every tool reads.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
# Calling the router without a socket (`api.rs` tests).
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
strip = true
