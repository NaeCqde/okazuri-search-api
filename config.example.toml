# okazuri-search-api config template.
#
# What the server does is switched here. The Japanese to romaji conversion (GET /romaji, and the romaji of every
# search query and title) has no switch: it is always on. [search], [magazine], [magazine.prefetch] and [cron] are off until they
# are asked for with enabled = true.
#
# Copy this to config.toml (gitignored) and change what you need. Every key is optional: the
# values below are the defaults, and a missing config.toml is the same as an empty one.
# okazuri-search-api reads config.toml from the current working directory, and only from there
# (or the file named with --config).

[server]
# The address to listen on. 127.0.0.1 is this machine only: put a reverse proxy (nginx, Caddy) in
# front of it to open it up. "0.0.0.0" listens on every interface; an IPv6 address such as "::"
# works too.
host = "127.0.0.1"
port = 8000

# The romaji conversion (GET /romaji, and the romaji of every search query and title). It has no switch: it is always on.
[romaji]
# The longest query of GET /romaji, in characters (not bytes). A longer one is answered with 422.
max_query_chars = 300

# Words that are written out instead of being read from the dictionary. The key is a word as
# UniDic splits it (see `okazuri-search-api convert`), the value is the romaji it is replaced by.
# They win over the built-in ones (ラーメン = ramen, メイド = maid, ...).
#
# Use it when the foreign spelling UniDic has for a katakana word is a different foreign word with
# the same sound (ラーメン is "Rahmen", German for "frame").
[romaji.exceptions]
# "ナース" = "nurse"

# The search engine: GET /okazuri/search?q=<words>. The query is asked to the search of every site of
# okazuri_bot/src/websites.ts; what their list pages show of each work (the title as the page writes it, and the
# path of its page; no image) is saved in a SQLite file; and the answer is every saved work whose title has all the
# words of the query. GET /okazuri/sites lists the sites and which of them can be searched.
[search]
enabled = true
# The first SQLite file (the second one is [magazine] mirror_path). Made if it is not there.
db_path = "search.db"
# A query is not asked to a site again within this time, by a request to /okazuri/search (live) or by the prefetch: the
# database answers. 720 hours is a month; after it the works are fetched again, and the ones that are gone are removed.
ttl_hours = 720
# A site that failed is not asked the same query again before this.
retry_failed_minutes = 60
# The longest query, in characters.
max_query_chars = 300
# How many sites are asked at the same time.
concurrency = 8
# How long a site may take to answer.
timeout_secs = 20
# The shortest time between two requests to the same site. Be kind to the sites: some answer 429 to a rush.
min_delay_ms = 1000
# The same, for one site (its name in GET /okazuri/sites), in place of min_delay_ms. Every request of the program to the site (a search,
# the prefetch, the crawl) keeps it together, so the crawl and the searches never ask a site more often than this.
# [search.site_delay_ms]
# "Hitomi.La" = 150
# "E-Hentai" = 3000
# The most works kept from one site's list page, and the most in one answer (a request may use limit=).
max_results_per_site = 50
max_results = 100
# The most saved works a search reads from the database when the indexes cannot answer it (a word that is a number, a short piece that is not
# letters and digits; the newest are kept). The other searches are answered by the indexes, with no limit.
max_candidates = 800000
# The first works of an answer are put in order by how good they are: the ones whose words start words of the title (`rashou mon` is in `Rashoumon`,
# not in `Kimera Shoujo ga Hoshii Mono`) come first. This many works are read and put in order; 0 keeps the order of the rows.
rank_window = 2000
# How much a query that names a tag adds to the score, by kind (the weight of the tag in the `tags` table counts too).
# tag_boost = { tag = 1.0, author = 6.0, circle = 4.0, weak = 0.25 }
# Sites that are left out (the names of GET /okazuri/sites): not asked by a search or the prefetch. What is saved of them is still in the answer,
# after the works of the other sites. The crawl and the verification have a list of their own ([crawl] disabled_sites). (A request leaves a site out of what it asks with `exclude`.) The demo
# server leaves out these three.
disabled_sites = ["177Picyy", "R18Best", "EHentai"]
# A site whose whole list the crawl has read is answered from the database and is not asked live (live=force still asks it). The
# other sites are asked as before. Turn it on when the database has the sites you want (after the crawl, or its `import --mark-done`); a site
# that is not crawled yet is asked as before, so it does no harm to leave it on.
skip_crawled = true
# Keep the pages of the database file (db_path, not its WAL) in memory: the file is mapped and locked (mlock), so the system never takes its
# pages out of the page cache and a search never waits for the disk (it is what `vmtouch -l search.db` does). The file is locked again when
# it grows or is replaced by another file (its inode changes). It needs the right to lock that much memory: in Docker, `cap_add: [IPC_LOCK]` and `ulimits: memlock: {soft: -1, hard: -1}`;
# without it the server only warns and goes on. Unix only.
pin_db = false
# Also try the sites that cannot be searched with a plain request (Cloudflare challenge, JavaScript). They fail.
try_unsupported = false
# A copy of the magazine tables (magazines, numbers, authors and works) of the Worker's D1 database. The server asks D1 whether
# the data changed (the Time Travel bookmark: no rows are read), and when it did, downloads the SQL that D1
# exports for those tables and loads it into the second SQLite file. The whole database cannot be exported
# because of its FTS5 table, so the tables are named. An export blocks the database for a moment.
[magazine]
enabled = false
account_id = ""
database_id = ""
# A Cloudflare API token that can edit D1. ${NAME} is the environment variable NAME: keep the token out of this file.
api_token = "${CLOUDFLARE_API_TOKEN}"
tables = ["magazines", "numbers", "authors", "works"]
mirror_path = "d1-mirror.db"
check_interval_minutes = 10

# Translations (GET /hitomila/translate, /google/translate, /auto/translate, and the English title of a search).
[translation]
# Google Translate gives the Advanced (Gemini) answer only to a request that has a token of its bot check, which only a browser
# makes. tools/google-translate-bridge is a Chrome (on a Mac, say) that makes the token and hands the request over; this program
# sends it. Empty: no bridge, and the answer is the one of the classic model.
google_bridge_url = ""
# What the bridge wants in "Authorization: Bearer" (its BRIDGE_TOKEN). Empty for none.
google_bridge_token = ""

# Translating the Japanese titles of the saved works with Google Translate ahead of time, so that a result has its English title and a
# search in English finds it. The newest works come first; a title that has a translation (Hitomi.La's, or a saved one) is skipped. One
# title is asked for at a time. Needs [search]; the bridge above is the one that is asked.
[translation.fill]
enabled = false
# The wait after each title that Google was asked for.
pause_ms = 3000
# The most titles asked in one round; the next round starts again from the newest works (the ones saved meanwhile come first).
max_per_round = 1000
# The wait before the next round when the last one did not use max_per_round (the titles are all translated, or Google does not answer).
round_interval_minutes = 60

# Searching ahead of time: the name of every issue in the copy becomes a query the way the bot makes it
# ("COMIC快楽天 2026年07月号" is "COMIC快楽天 2026 07", searched in romaji), and is searched like a request, newest issue first. A
# query that is searched already is skipped. Needs [search]; the copy comes from [magazine].
[magazine.prefetch]
enabled = false
# The wait between two queries.
query_delay_ms = 2000
# The most queries in one round (0: all). The next round goes on from there.
max_queries_per_round = 0
# The wait between two rounds when everything is searched already (a change of the copy starts one at once).
round_interval_minutes = 60

# Which log lines have what a person searched for (and what it was translated to). `off`: none, a line says that there was a
# query and keeps its time and its error. `errors` (the default): the lines of a failure (warnings and errors) have it, to find the query that failed.
# `all`: every line that talks of a query has it, the timings too. Set when the file is read.
[log]
queries = "errors"

# Scheduled HTTP requests: the server calls a URL on a schedule, so a job that has to be run from this
# machine needs no crontab and curl next to it. Off unless enabled = true; while it is off, the jobs
# below are not even checked. A mistake in this section stops the start with a message that names the job.
[cron]
enabled = false
# The clock the schedules are read on: "+09:00", "-05:30" or "UTC".
utc_offset = "UTC"

# One [[cron.jobs]] for each request. Only name, schedule and url are required.
#
#   name          shown in the log; different for each job
#   schedule      minute hour day-of-month month day-of-week, like crontab: "*", "5", "1-5", "*/15",
#                 "10-30/5", "0,30"; month and weekday can be names ("jan", "mon-fri"). When both the day of
#                 the month and the weekday are given, either of them is enough (as in cron).
#   url           http:// or https://
#   method        default "GET"
#   headers       ${NAME} in a value is the environment variable NAME, so that a secret is not written here
#   body          the request body (a string)
#   timeout_secs  default 30. A job that is still running when its next time comes is skipped.
#   enabled       default true
#
# [[cron.jobs]]
# name = "okazuri-fetch-magazines"
# schedule = "*/10 * * * *"
# method = "POST"
# url = "https://okazuri-bot.example.workers.dev/internal/fetch-magazines"
# timeout_secs = 150
#
# [cron.jobs.headers]
# Authorization = "Bearer ${CRON_SECRET}"
# Content-Type = "application/json"

# Reading the whole list of the sites that have one (docs/SEARCH.md, "Crawling"). The searches stay; the prefetch asks only the sites
# the crawl has no list for.
[crawl]
enabled = false
# When the newest pages are read again, after the first walk is done (five fields; the clock is utc_offset).
schedule = "17 * * * *"
utc_offset = "UTC"
# Sites to crawl (empty: all that have a list).
sites = []
# Sites that the crawl and the verification leave out (the names of GET /okazuri/sites). The searches have a list of their own: [search] disabled_sites.
disabled_sites = []
# k/N: this machine reads the pages whose number leaves k when divided by N. Run N machines with 0/N ... N-1/N, then `export` on each and
# `import` the files on the server. Lists that go one page to the next (RokuHentai, E-Hentai) are read by 0/N only.
shard = "0/1"
# lo-hi: the ids of E-Hentai this machine reads (E-Hentai is a list that goes one page to the next, so it is not cut by `shard`, but its
# `?next=<id>` can start at any id): three machines are e.g. "3060000-" (the newest, and the newest pages again afterwards),
# "1860000-3059999" and "-1859999". A machine with a `hi` stops at its `lo`. Empty: the whole list.
gallery_ids = ""
# index-all.nozomi (every language) or index-japanese.nozomi.
hitomi_index = "index-all.nozomi"
hitomi_batch = 100
# The newest pages are read until one is known (so a long pause is caught up); this is only the most pages of one reading.
refresh_pages = 1000
# How long a walk that failed waits before it starts again. A ban of the address (E-Hentai: 5 minutes the first time, 1 hour the next) says
# how long it lasts, and the walk waits that long when it is longer than this.
retry_minutes = 5

# Looking at the page of every saved work of the sites that tell when a work is gone (RokuHentai, HentaiEnvy, Nya:Hentai, momon:GA,
# Sukebei, AsmHentai, HentaiEra, Wnacg), once in `interval_days`, and marking the works whose page is gone (`works.deleted`, with no title: no search
# finds them). The sites still list such a work, so a list, the crawl or an import does not save it again. A site is asked one page every
# `interval_days / works` (900 000 works in 30 days: a page every 2.9 s), never closer than the delay of the site.
[crawl.verify]
enabled = false
# Empty: every site of that list.
sites = []
interval_days = 30
# A site is never asked two pages closer than this, so a site with more works than interval_days allows is looked at over more days.
min_pause_ms = 5000

# Handing the reading of the sites to other machines (dist.rs). The host (the server that keeps the database) cuts the crawl and the
# verification into jobs; each worker (a machine with an IP address of its own, with [crawl] and [crawl.verify] on and its own small database)
# asks the sites and gives the pages back. The first walk of a list whose pages are numbered is cut in jobs of `job_pages` pages that the workers take as they are free
# (up to `workers` * 2 jobs are given out at a time, and the pages that are read are kept as ranges), so workers can come and go at any time, and each worker waits the delay of the site on its own. The host needs the same [crawl] / [crawl.verify] settings as always; a worker needs `host` and `token`.
[distribute]
role = "off"                       # off, host or worker
token = ""                         # the same on the host and its workers
host = ""                          # of a worker: http://<address of the host>:<its port>
workers = 3                        # of the host: how many workers there are (the verification cuts its pages for them)
job_seconds = 180                  # of the host: the longest a job of the crawl reads (a slow site gives fewer pages per job)
job_pages = 10                     # of the host: how many pages a job of the crawl reads before the worker answers (one after another)
